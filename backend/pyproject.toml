[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"
# O whitenoise avisa sobre staticfiles/, que so existe depois do collectstatic no build.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["accounts", "tasks", "integrations", "core"]
omit = ["*/migrations/*", "*/tests/*"]
