# Publica as imagens no GitHub Container Registry e aponta os Azure Container Apps para a tag nova.
# So executa quando o repositorio tem a variavel AZURE_ENABLED e o segredo de acesso.
name: Deploy Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_BACKEND: ghcr.io/kaylan00/advicetodo-backend
  IMAGE_WEB: ghcr.io/kaylan00/advicetodo-web
  GRUPO: rg-advicetodo

jobs:
  deploy:
    if: vars.AZURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar as imagens
        run: |
          docker build --target prod -t $IMAGE_BACKEND:${{ github.sha }} -t $IMAGE_BACKEND:latest ./backend
          docker build -t $IMAGE_WEB:${{ github.sha }} -t $IMAGE_WEB:latest ./web
          docker push --all-tags $IMAGE_BACKEND
          docker push --all-tags $IMAGE_WEB

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Apontar os Container Apps para a nova imagem
        run: |
          az containerapp update -n advicetodo-api -g $GRUPO --image $IMAGE_BACKEND:${{ github.sha }}
          az containerapp update -n advicetodo-web -g $GRUPO --image $IMAGE_WEB:${{ github.sha }}
