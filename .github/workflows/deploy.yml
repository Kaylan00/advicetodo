# Publica as duas imagens no Azure Container Registry e aponta os Web Apps para a tag nova.
# So roda quando o repositorio tem as credenciais configuradas (variavel AZURE_ENABLED).
name: Deploy Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.AZURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Backend
        run: |
          docker build --target prod \
            -t ${{ vars.ACR_LOGIN_SERVER }}/advicetodo-backend:${{ github.sha }} ./backend
          docker push ${{ vars.ACR_LOGIN_SERVER }}/advicetodo-backend:${{ github.sha }}

      - name: Front
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/advicetodo-web:${{ github.sha }} ./web
          docker push ${{ vars.ACR_LOGIN_SERVER }}/advicetodo-web:${{ github.sha }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_BACKEND }}
          images: ${{ vars.ACR_LOGIN_SERVER }}/advicetodo-backend:${{ github.sha }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_WEB }}
          images: ${{ vars.ACR_LOGIN_SERVER }}/advicetodo-web:${{ github.sha }}
