# Dois caminhos para a nuvem:
#   push na main    -> publica as imagens no GitHub Container Registry e aponta os Container Apps
#   execucao manual -> so aponta os Container Apps para uma tag ja publicada
# Ambos so rodam com a variavel AZURE_ENABLED e o segredo de acesso configurados.
name: Deploy Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag das imagens ja publicadas no registry
        default: latest
      semear:
        description: Recarregar os dados de demonstração
        type: boolean
        default: false

env:
  IMAGE_BACKEND: ghcr.io/kaylan00/advicetodo-backend
  IMAGE_WEB: ghcr.io/kaylan00/advicetodo-web
  GRUPO: rg-advicetodo

jobs:
  publicar:
    name: Publicar as imagens
    if: vars.AZURE_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker build --target prod -t $IMAGE_BACKEND:${{ github.sha }} -t $IMAGE_BACKEND:latest ./backend
          docker build -t $IMAGE_WEB:${{ github.sha }} -t $IMAGE_WEB:latest ./web
          docker push --all-tags $IMAGE_BACKEND
          docker push --all-tags $IMAGE_WEB

  apontar:
    name: Apontar os Container Apps
    needs: [publicar]
    # Na execucao manual o job de publicacao e pulado, e isso nao pode barrar o deploy.
    if: ${{ always() && vars.AZURE_ENABLED == 'true' && needs.publicar.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Definir a tag
        id: alvo
        run: echo "tag=${{ github.event.inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Backend
        run: |
          az containerapp update -n advicetodo-api -g $GRUPO \
            --image $IMAGE_BACKEND:${{ steps.alvo.outputs.tag }} \
            --set-env-vars SEED_DEMO=${{ github.event.inputs.semear == 'true' && '1' || '0' }}

      - name: Front
        run: |
          az containerapp update -n advicetodo-web -g $GRUPO \
            --image $IMAGE_WEB:${{ steps.alvo.outputs.tag }}

      - name: Endereco publicado
        run: |
          az containerapp show -n advicetodo-web -g $GRUPO \
            --query "properties.configuration.ingress.fqdn" -o tsv
