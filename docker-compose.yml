name: advicetodo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-advicetodo}
      POSTGRES_USER: ${POSTGRES_USER:-advicetodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advicetodo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-advicetodo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-chave-apenas-para-desenvolvimento}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      # O nginx repassa o Host original, entao entram tanto o acesso do navegador
      # quanto o nome do servico usado dentro da rede do compose.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,web}
      DATABASE_URL: postgres://${POSTGRES_USER:-advicetodo}:${POSTGRES_PASSWORD:-advicetodo}@db:5432/${POSTGRES_DB:-advicetodo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/healthz/")
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
