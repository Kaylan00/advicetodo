name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: advicetodo
          POSTGRES_USER: advicetodo
          POSTGRES_PASSWORD: advicetodo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://advicetodo:advicetodo@localhost:5432/advicetodo
      DJANGO_SECRET_KEY: chave-de-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .
      - run: ruff format --check .

      - run: pytest --cov --cov-report=term-missing

  frontend:
    name: Front (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Selenium sobre o compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r e2e/requirements.txt

      - name: Subir a aplicacao e o navegador
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Aguardar o Selenium
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4444/status && exit 0
            sleep 2
          done
          echo "Selenium nao respondeu a tempo" && exit 1

      - run: pytest
        working-directory: e2e

      - name: Logs dos containers quando falha
        if: failure()
        run: docker compose logs --tail 200
